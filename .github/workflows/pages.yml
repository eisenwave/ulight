name: Emscripten build and deploy to pages

on:
  push:
    branches: ["main", "pages-action"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Install emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          cd ..
          echo "-----------------"
          ls -R emsdk/upstream/emscripten
    
      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_COLOR_DIAGNOSTIC=ON
          -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always"
          -DCMAKE_TOOLCHAIN_FILE=emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test WASM highlighting parity (node:test)
        run: ULIGHT_WASM_PATH=www/ulight.wasm node --test test/highlight_wasm.test.mjs

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "www"

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
